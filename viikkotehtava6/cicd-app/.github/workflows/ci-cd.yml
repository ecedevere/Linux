name: CI/CD for LEMP Containers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------
      # BACKEND IMAGE BUILD & PUSH
      # -----------------------------
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .                                    # Корень репозитория (обязательно для поддиректорий)
          file: ./backend/Dockerfile                    # Путь к Dockerfile относительно корня
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:latest
          cache-to: type=inline

      # -----------------------------
      # FRONTEND IMAGE BUILD & PUSH
      # -----------------------------
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .                                    # Корень репозитория
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:latest
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Деплой только на main-ветке (можно убрать, если нужно деплоить всегда)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Обычно root или другой пользователь
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/lemp/viikkotehtava6/cicd-app
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose ps
            echo "Deployment completed successfully!"
