version: '3.8'

services:
  db:
    image: mysql:8
    container_name: lemp_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lemp
      MYSQL_USER: lempuser
      MYSQL_PASSWORD: lemp123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    image: ecedevere/lemp-backend:latest
    container_name: lemp_backend
    environment:
      DB_HOST: db
      DB_USER: lempuser
      DB_PASSWORD: lemp123
      DB_NAME: lemp
    ports:
      - "5003:5000"
    depends_on:
      - db

  frontend:
    image: ecedevere/lemp-frontend:latest
    container_name: lemp_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
