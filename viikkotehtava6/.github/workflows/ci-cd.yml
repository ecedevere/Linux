name: CI/CD for LEMP Containers
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Debug - Show directory structure
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== cicd-app directory ==="
          ls -la cicd-app/ || echo "cicd-app not found!"
          echo "=== cicd-app/backend directory ==="
          ls -la cicd-app/backend/ || echo "backend not found!"
          echo "=== cicd-app/frontend directory ==="
          ls -la cicd-app/frontend/ || echo "frontend not found!"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./cicd-app/backend
          file: ./cicd-app/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:latest
          cache-to: type=inline
      
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./cicd-app/frontend
          file: ./cicd-app/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:latest
          cache-to: type=inline
  
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/lemp/viikkotehtava6/cicd-app
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose ps
