name: CI/CD for LEMP Containers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Убедимся, что весь репозиторий скачан полностью
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------
      # BACKEND IMAGE BUILD & PUSH
      # -----------------------------
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend               # Теперь контекст — именно папка backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/cicd-backend:latest
          cache-to: type=inline
          # Ключевая строка — отключаем git-context
          no-cache: false
          provenance: false
          sbom: false
          # Принудительно используем обычный контекст (не git)
          load: false
          platforms: linux/amd64

      # -----------------------------
      # FRONTEND IMAGE BUILD & PUSH
      # -----------------------------
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/cicd-frontend:latest
          cache-to: type=inline
          no-cache: false
          provenance: false
          sbom: false
          load: false
          platforms: linux/amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'  # Деплой только на main

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}       # Исправлено: раньше было DOCKERHUB_USERNAME
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/lemp/viikkotehtava6/cicd-app
            docker compose pull cicd-backend cicd-frontend
            docker compose down
            docker compose up -d
            docker compose ps
            echo "Deployment completed successfully!"
